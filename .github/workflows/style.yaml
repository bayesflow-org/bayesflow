name: Check Code Style

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  check-code-style:
    name: Check Code Style

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Dependencies
        run: uv pip install ruff

      - name: Run Linter
        run: uv run ruff check --config pyproject.toml --verbose

      - name: Run Formatter
        run: uv run ruff format --config pyproject.toml --check --verbose
