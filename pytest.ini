[pytest]
addopts = --cov=bayesflow --strict-markers --verbose --ignore=tests/test_experimental

markers =
    jax: mark test as requiring JAX
    numpy: mark test as requiring NumPy
    tensorflow: mark test as requiring TensorFlow
    torch: mark test as requiring PyTorch
    slow: mark test as especially slow, such as running a whole fitting workflow
    cpu_fallback_on_mps: run this test on the CPU instead of torch's MPS device

testpaths =
    tests
