
# From https://github.com/eeholmes/readthedoc-test/blob/main/.github/workflows/docs_pages.yml
name: multiversion-docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stable-legacy

jobs:

  build_docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: repo
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Create local branches
        run: |
          cd ./repo
          git branch stable-legacy remotes/origin/stable-legacy

      - name: Make the Sphinx docs
        run: |
          cd ./repo/docsrc
          uv run make clean
          uv run make production-docs-sequential

      - name: Checkout gh-pages-dev
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: gh-pages-dev
          ref: gh-pages-dev

      - name: Commit changes to docs
        run: |
          cd ./gh-pages-dev
          git rm --quiet -rf .
          cp -r ../repo/docs/. ./
          git config --local user.email ""
          git config --local user.name "github-actions"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "auto: Rebuild docs."
            git push
          else
            echo No commit made because the docs have not changed.
          fi
