
name: test-docs

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  build_docs:
    runs-on: ubuntu-latest
    env:
      KERAS_BACKEND: "jax"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Install JAX
        run: uv pip install -U jax

      - name: Make docs from local state
        run: |
          cd ./docsrc
          uv run make clean
          uv run make local-docs

      - name: Clean up
        run: |
          cd ./docsrc
          uv run make clean-all
