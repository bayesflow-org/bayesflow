name: Multi-Backend Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Run ${{ matrix.backend }} tests on ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"] # we usually only need to test the oldest python version
        backend: ["jax", "tensorflow", "torch"]

    runs-on: ${{ matrix.os }}

    env:
      KERAS_BACKEND: ${{ matrix.backend }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --extra test

      - name: Install JAX
        if: ${{ matrix.backend == 'jax' }}
        run: |
          uv pip install -U jax

      - name: Install TensorFlow
        if: ${{ matrix.backend == 'tensorflow' }}
        run: |
          uv pip install -U tensorflow

      - name: Install PyTorch
        if: ${{ matrix.backend == 'torch' }}
        run: |
          uv pip install -U torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Show Environment Info
        run: |
          uv run python --version
          uv pip --version
          uv run printenv | sort
          uv pip list

      - name: Run Tests
        run: |
          uv run pytest -x -m "not slow"

      - name: Run Slow Tests
        # Run slow tests, such as full integration notebooks:
        # - only on Ubuntu, Python 3.11, JAX Backend
        # - only on workflow_dispatch or pushes/PR to main branch
        if: |
          ${{
            matrix.os == 'ubuntu-latest'
            && matrix.python-version == '3.11'
            && matrix.backend == 'jax'
            && (
              github.event.name == 'workflow_dispatch'
              || (github.event.name == 'push' && github.ref_name == 'main')
              || (github.event.name == 'pull_request' && github.base_ref == 'main')
            )
          }}
        run: |
          uv run pytest -m "slow"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Create Coverage Report
        run: |
          uv run coverage xml

      - name: Upload Coverage Reports to CodeCov
        uses: codecov/codecov-action@v6
        with:
          # do not use the files attribute here, otherwise the reports are not merged correctly
          token: ${{ secrets.CODECOV_TOKEN }}
