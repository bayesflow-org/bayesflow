name: Experimental Tests

on:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Run ${{ matrix.backend }} tests on ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"] # we usually only need to test the oldest python version
        backend: ["jax", "tensorflow", "torch"]

    runs-on: ${{ matrix.os }}

    permissions: {}

    env:
      KERAS_BACKEND: ${{ matrix.backend }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Environment
        run: uv venv

      - name: Install Dependencies
        run: uv sync --extra test

      - name: Install JAX
        if: ${{ matrix.backend == 'jax' }}
        run: |
          uv pip install -U jax

      - name: Install TensorFlow
        if: ${{ matrix.backend == 'tensorflow' }}
        run: |
          uv pip install -U tensorflow

      - name: Install PyTorch
        if: ${{ matrix.backend == 'torch' }}
        run: |
          uv pip install -U torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Run Tests
        run: |
          uv run pytest -x -m "not slow"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Create Coverage Report
        run: |
          uv run coverage xml

      - name: Upload Coverage Reports to CodeCov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          # do not use the files attribute here, otherwise the reports are not merged correctly
          token: ${{ secrets.CODECOV_TOKEN }}

  test-experimental:
    name: Run experimental ${{ matrix.backend }} tests on ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
        backend: ["jax", "tensorflow", "torch"]

    runs-on: ${{ matrix.os }}

    env:
      KERAS_BACKEND: ${{ matrix.backend }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Environment
        run: uv venv

      - name: Install Dependencies
        run: uv sync --extra test

      - name: Install JAX
        if: ${{ matrix.backend == 'jax' }}
        run: |
          uv pip install -U jax

      - name: Install TensorFlow
        if: ${{ matrix.backend == 'tensorflow' }}
        run: |
          uv pip install -U tensorflow

      - name: Install PyTorch
        if: ${{ matrix.backend == 'torch' }}
        run: |
          uv pip install -U torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Run Experimental Tests
        run: |
          uv run pytest -x -m "not slow" --override-ini="addopts=--cov=bayesflow --strict-markers --verbose"

      - name: Upload Coverage Reports to CodeCov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
