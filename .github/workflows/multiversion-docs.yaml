# From https://github.com/eeholmes/readthedoc-test/blob/main/.github/workflows/docs_pages.yml
name: multiversion-docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stable-legacy

jobs:

  build_docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: repo
          ref: main
          fetch-depth: 0  # fetch all history for all branches
          fetch-tags: true
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Setup Environment
        working-directory: repo
        run: uv venv

      - name: Install dependencies
        working-directory: repo
        run: uv sync --extra docs

      - name: Create local branches
        run: |
          cd ./repo
          git branch stable-legacy remotes/origin/stable-legacy

      - name: Make the Sphinx docs
        run: |
          cd ./repo/docsrc
          uv run make clean
          uv run make production-docs-sequential

      - name: Checkout gh-pages-dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gh-pages-dev
          ref: gh-pages-dev

      - name: Commit changes to docs
        run: |
          cd ./gh-pages-dev
          git rm --quiet -rf .
          cp -r ../repo/docs/. ./
          git config --local user.email ""
          git config --local user.name "github-actions"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "auto: Rebuild docs."
            git push
          else
            echo No commit made because the docs have not changed.
          fi
